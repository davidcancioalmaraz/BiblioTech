<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiblioTech — Acceso</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <header class="login-header">
        <p class="brand">BiblioTech</p>
        <h1 class="login-title">Acceso al sistema</h1>
        <p class="login-subtitle">Introduce tus credenciales para continuar</p>
      </header>

      <form class="login-form" action="dashboard.html" method="get">
        <div class="field">
          <label class="field-label" for="username">Usuario</label>
          <input
            class="field-input"
            type="text"
            id="username"
            name="username"
            placeholder="Nombre de usuario"
            maxlength="40"
            required
          />
        </div>

        <div class="field">
          <label class="field-label" for="password">Contraseña</label>
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña"
            maxlength="40"
            required
          />
        </div>

        <label class="checkbox" for="remember">
          <input class="checkbox-input" type="checkbox" id="remember" name="remember" value="yes" />
          <span class="checkbox-label">Recordarme</span>
        </label>

        <button class="btn btn-primary btn-block" type="submit">Iniciar sesión</button>
      </form>

      <footer class="login-footer">
        <p>Biblioteca municipal · Área de préstamos</p>
      </footer>
    </main>
  </body>
</html>
