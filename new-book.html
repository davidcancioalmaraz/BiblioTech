<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BiblioTech — Nuevo libro</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <p class="brand brand-inverse">BiblioTech</p>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <li><a class="sidebar-link" href="dashboard.html">Panel</a></li>
          <li><a class="sidebar-link is-active" href="books.html">Libros</a></li>
          <li><a class="sidebar-link" href="loans.html">Préstamos</a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a class="sidebar-link" href="index.html">Cerrar sesión</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h1 class="topbar-title">Libros</h1>
        <div class="topbar-user">
          <span class="topbar-username">Elena Vargas Nieto</span>
          <a class="topbar-logout" href="index.html">Cerrar sesión</a>
        </div>
      </header>

      <main class="content">
        <div class="section-header">
          <div>
            <h2 class="section-title">Nuevo libro</h2>
            <p class="section-subtitle">Añade un ejemplar al catálogo</p>
          </div>
        </div>

        <section class="panel">
          <form class="form" action="books.html" method="get">
            <div class="form-grid">
              <div class="field">
                <label class="field-label" for="code">Código</label>
                <input
                  class="field-input"
                  type="text"
                  id="code"
                  name="code"
                  placeholder="LIB-011"
                  maxlength="10"
                  required
                />
                <p class="field-hint">Formato recomendado: LIB-000</p>
              </div>

              <div class="field">
                <label class="field-label" for="category">Categoría</label>
                <select class="field-select" id="category" name="category">
                  <option value="fiction">Ficción</option>
                  <option value="essay">Ensayo</option>
                  <option value="technical">Técnico</option>
                  <option value="children">Infantil</option>
                  <option value="reference">Referencia</option>
                </select>
              </div>

              <div class="field field-full">
                <label class="field-label" for="title">Título</label>
                <input
                  class="field-input"
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Título completo de la obra"
                  maxlength="120"
                  required
                />
              </div>

              <div class="field">
                <label class="field-label" for="author">Autor</label>
                <input
                  class="field-input"
                  type="text"
                  id="author"
                  name="author"
                  placeholder="Nombre y apellidos"
                  maxlength="80"
                  required
                />
              </div>

              <div class="field">
                <label class="field-label" for="year">Año</label>
                <input
                  class="field-input"
                  type="number"
                  id="year"
                  name="year"
                  placeholder="1967"
                  min="1450"
                  max="2026"
                />
              </div>

              <div class="field">
                <label class="field-label" for="copies">Ejemplares</label>
                <input
                  class="field-input"
                  type="number"
                  id="copies"
                  name="copies"
                  placeholder="1"
                  min="0"
                />
              </div>

              <div class="field">
                <label class="field-label" for="status">Estado</label>
                <select class="field-select" id="status" name="status">
                  <option value="available">Disponible</option>
                  <option value="on-loan">Prestado</option>
                  <option value="under-repair">En reparación</option>
                </select>
              </div>
            </div>

            <div class="form-actions">
              <a class="btn btn-secondary" href="books.html">Cancelar</a>
              <button class="btn btn-primary" type="submit">Guardar</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
